<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}Smarthome{% endblock %}</title>
</head>
<body class="site-wrapper">
    <header>
        <div class="start-page header-component">
            <a href="{{ url_for('web.index') }}">@</a>
        </div>

        <div class="temp-page header-component">
            <a href="{{ url_for('web.weather') }}">Temps</a>
        </div>
        
        <div class="chart-page header-component">
            <a href="{{ url_for('web.chart') }}">Chart</a>
        </div>

        <div class="db-page header-component">
            <a href="{{ url_for('web.database') }}">Database</a>
        </div>
    </header>

    <main class="site-content">
        {% block content %}
        <div class="container">
            <div class="row">
                <div class="tile-1 tiles">
                    <div class="test-tile temp-tile"><a href="{{ url_for('web.weather') }}">Weather</a></div>
                </div>
                <div class="tile-2 tiles">
                    <div class="test-tile"><a href="{{ url_for('web.database') }}">Database</a></div>
                </div>
                <div class="tile-3 tiles">
                    <div class="test-tile"><a href="{{ url_for('web.chart')}}">Charts</a></div>
                </div>
            </div>
        </div>
        {% endblock %}
    </main>

    <footer>
        <p>franek dyga</p>
        <p>kacper bara</p>
        <p>michal gniadek</p>
    </footer>
</body>
</html>
